name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` installs strictly from package-lock.json and fails if the
      # lock file is out of sync with package.json.
      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:ci

      # GitHub Actions sets CI=true automatically, which makes react-scripts
      # treat ESLint warnings as build failures.
      - name: Build
        run: npm run build
